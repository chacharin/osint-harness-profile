# Hermes profile distribution - install with:
#   hermes profile install github.com/chacharin/harness-server
# Hermes copies SOUL.md, config.yaml, skills/ and plugins/ into ~/.hermes/profiles/osint/ (or /opt/data/profiles/osint
# in the Docker image). Profile names are lowercase in Hermes, so the profile is "osint".
name: osint
version: 0.4.0
description: OSINT intelligence analyst agent - persona, a gated 4-step STEEPM analyst skill, and MCP tools
  (Perplexity web search, Thai proofreading, LightRAG knowledge base)
hermes_requires: ">=0.21.6"
author: Chacharin Lertyosbordin
license: MIT
env_requires:
  - name: OPENROUTER_API_KEY
    description: OpenRouter API key for the agent's LLM (the model is set in config.yaml)
  - name: API_SERVER_KEY
    description: key that apps send as "Authorization Bearer" to call this profile at http://<gateway>:8642/p/osint/v1
# only the agent is installed into the profile; README, LICENSE and docker-compose stay in the repo
distribution_owned:
  - SOUL.md
  - config.yaml
  - skills
  - plugins               # usage-telemetry: per-call token and timing log (enabled in config.yaml)
  - .env.template
  - .no-bundled-skills   # only skills/ of this repo: Hermes' bundled skills are not seeded
  - distribution.yaml
