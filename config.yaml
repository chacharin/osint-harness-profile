# =============================================================================
# config.yaml ของ profile osint — ติดตั้งโดย `hermes profile install`
# -----------------------------------------------------------------------------
# ไฟล์นี้มีเฉพาะค่าที่ต่างจากค่าเริ่มต้นของ Hermes ค่าอื่นทั้งหมด Hermes ใช้ค่าเริ่มต้นของตัวเอง
# `hermes profile update` จะไม่เขียนทับไฟล์นี้ ค่าที่ผู้ใช้แก้ภายหลังจึงยังอยู่
# =============================================================================
_config_version: 50                # รูปแบบ config ของ Hermes 0.21.6 (ถ้าไม่ระบุ Hermes จะถือว่าเป็น config เก่ามาก)

# --- LLM ---
model:
  default: google/gemma-4-31b-it   # model บน OpenRouter ควรเลือก model ที่รองรับภาษาไทยและการเรียกใช้เครื่องมือได้ดี
  provider: openrouter             # ใช้ OPENROUTER_API_KEY ในไฟล์ .env ของ profile
  base_url: ''
  api_mode: chat_completions

# --- การทำงานของเอเจนต์ ---
agent:
  max_turns: 150                   # จำนวนรอบเรียกเครื่องมือสูงสุดต่อหนึ่งคำสั่ง (ค่าเริ่มต้นของ Hermes คือ 500)
terminal:
  cwd: /opt/data/workspace         # โฟลเดอร์ทำงานกลาง: แฟ้มงานของ intelligence-analyzer และไฟล์ที่บันทึกตามกฎข้อ 3 อยู่ที่นี่
                                   # MCP ที่แก้ไฟล์และแอปที่อ่านไฟล์ เข้าถึงโฟลเดอร์นี้ด้วย mount หรือผ่าน API ไฟล์ของ dashboard

# --- เครื่องมือ ---
# ชุดเครื่องมือเมื่อใช้งานผ่าน Hermes CLI ส่วน API (/v1) ใช้ชุดเครื่องมือมาตรฐานของ API server
platform_toolsets:
  cli: [browser, code_execution, computer_use, connections, context_engine, cronjob, delegation, file, memory, session_search, skills, terminal, todo, web]
browser:
  backend: browser-use
computer_use:
  backend: cua

# --- plugin ---
# usage-telemetry (plugins/ ของ repo นี้) บันทึก token และเวลาของการเรียก LLM และเครื่องมือทุกครั้ง
# ลง logs/usage/ ของ profile สำหรับงานวิจัยและการปรับประสิทธิภาพ (ดู README หัวข้อ "ข้อมูลการใช้งานสำหรับงานวิจัย")
plugins:
  enabled: [usage-telemetry]

# --- MCP servers ---
# แต่ละตัวต้องทำงานอยู่ใน docker network เดียวกับ Hermes ก่อน (ดูลิงก์ใน README)
# timeout ต้องนานกว่าเวลาที่เครื่องมือใช้จริง มิฉะนั้นเอเจนต์จะเห็นว่าการเรียกล้มเหลวทั้งที่ server ยังทำงานอยู่
mcp_servers:
  perplexity:                      # ค้นหาเว็บและถามตอบผ่าน Perplexity (github.com/chacharin/mcp-perplexity)
    url: http://mcp-perplexity:8080/mcp
    timeout: 600                   # perplexity_research อาจใช้เวลาหลายนาที
  thai_proofread:                  # ตรวจและแก้คำสะกดภาษาไทย (github.com/chacharin/mcp-thai-proof-md)
    url: http://mcp-thai-proofread:8800/mcp
    timeout: 900                   # เอกสารยาวอาจใช้เวลาหลายนาที
  lightrag:                        # คลังความรู้ LightRAG (github.com/chacharin/mcp-lightrag)
    url: http://mcp-lightrag:8700/mcp
    timeout: 180                   # ต้องนานกว่า QUERY_TIMEOUT_SECONDS ของ mcp-lightrag (120)
